# Minimal local stack for the demo (devops agent — Act 5).
#   docker compose -f deployment/docker/docker-compose.yml up --build
#
# Then:
#   curl localhost:8000/api/health/check   -> 200 (DEGRADED: no database wired in below)
#   open http://localhost:3000             -> status page
services:
  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      # Rate limiting (in-memory limiter — see apps/backend/src/rate_limit.py):
      RATE_LIMIT_REQUESTS: "60"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      # Uncomment the postgres service below and point the probe at it for a healthy DB:
      # DB_HOST: "postgres"

  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

