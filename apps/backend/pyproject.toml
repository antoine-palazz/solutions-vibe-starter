[project]
name = "solutions-vibe-starter-backend"
version = "0.1.0"
description = "Minimal FastAPI backend for the Vibe configuration starter."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "loguru>=0.7",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
