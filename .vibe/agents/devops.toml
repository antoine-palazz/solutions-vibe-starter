display_name = "DevOps"
description = "Ingénieur DevOps — build, déploiement, infrastructure. A accès à Linear pour mettre à jour le statut de déploiement. Ne peut pas modifier le code source applicatif."
safety = "destructive"
agent_type = "agent"

# Le DevOps peut lancer des commandes d'infra mais pas toucher au code applicatif
[tools.bash]
permission = "always"
allowlist = ["docker*", "docker-compose*", "kubectl*", "helm*", "curl*", "ls*", "cat*", "git*", "make*"]
denylist = ["rm -rf*", "sudo*", "python*", "pytest*"]

[tools.read]
permission = "always"

[tools.grep]
permission = "always"

[tools.edit]
permission = "ask"
allowlist = ["deployment/*", "docker-compose*", "Dockerfile*", "*.yaml", "*.yml", ".env*"]
denylist = ["apps/*"]

[tools.write_file]
permission = "ask"
allowlist = ["deployment/*", "docker-compose*", "Dockerfile*", "*.yaml", "*.yml"]
denylist = ["apps/*"]

# Outils MCP — Linear pour mettre à jour le statut de déploiement
[tools.linear_get_issue]
permission = "always"

[tools.linear_save_issue]
permission = "always"

[tools.linear_save_comment]
permission = "always"
