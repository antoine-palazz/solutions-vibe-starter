display_name = "Product Owner"
description = "Product owner — lit le code, écrit les specs, les RFC et la documentation. A accès à Notion pour publier la doc. Ne peut pas exécuter de commandes ni modifier le code source."
safety = "safe"
agent_type = "agent"

# Le PO peut tout lire mais n'écrit que docs/specs — aucune exécution de code
[tools.read]
permission = "always"

[tools.grep]
permission = "always"

[tools.write_file]
permission = "always"
allowlist = ["docs/*", "*.md", "rfcs/*"]
denylist = ["*.py", "*.ts", "*.tsx", "*.js", "*.toml", "*.yaml", "*.yml"]

[tools.edit]
permission = "always"
allowlist = ["docs/*", "*.md", "rfcs/*"]
denylist = ["*.py", "*.ts", "*.tsx", "*.js"]

[tools.bash]
permission = "never"

# Outils MCP — Notion pour publier la doc, Linear pour lire les tickets
[tools.notion_search]
permission = "always"

[tools.notion_fetch]
permission = "always"

[tools.notion_create_pages]
permission = "always"

[tools.notion_update_page]
permission = "always"

[tools.linear_get_issue]
permission = "always"

[tools.linear_list_issues]
permission = "always"

disabled_tools = ["websearch"]
