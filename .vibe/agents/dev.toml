display_name = "Développeur"
description = "Ingénieur logiciel — coder, déboguer, tester. Accès complet au code, au terminal, à Linear et Notion."
safety = "neutral"
agent_type = "agent"

# Le dev peut lire, écrire et exécuter — workflow de dev standard
[tools.bash]
permission = "always"
allowlist = ["pytest*", "python*", "uv *", "git *", "ls*", "cat*", "ruff*", "curl*"]
denylist = ["rm -rf*", "sudo*", "docker*"]

[tools.read]
permission = "always"

[tools.edit]
permission = "always"

[tools.write_file]
permission = "always"

[tools.grep]
permission = "always"

# Outils MCP — Linear pour la gestion des tickets, Notion pour la doc.
# Ils nécessitent que les serveurs MCP correspondants soient configurés (voir .vibe/config.toml.example).
[tools.linear_get_issue]
permission = "always"

[tools.linear_list_issues]
permission = "always"

[tools.linear_save_issue]
permission = "always"

[tools.linear_save_comment]
permission = "always"

[tools.notion_search]
permission = "always"

[tools.notion_fetch]
permission = "always"
